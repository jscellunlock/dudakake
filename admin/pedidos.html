<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pedidos</title>
</head>
<body>

<h2>Pedidos</h2>

<div id="listaPedidos"></div>

<script>

fetch("/data/pedidos.json")
.then(r=>r.json())
.then(p=>{

p.forEach(item=>{

document.getElementById("listaPedidos").innerHTML +=
"<div>"+item+"</div>"

})

})

</script>

</body>
</html>
