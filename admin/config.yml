backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:

  - name: "produtos"
    label: "Produtos"
    folder: "data"
    create: true
    slug: "{{slug}}"

    fields:

      - {label: "ID", name: "id", widget: "number"}
      - {label: "Nome", name: "nome", widget: "string"}
      - {label: "Descrição", name: "desc", widget: "text"}
      - {label: "Preço", name: "preco", widget: "string"}
      - {label: "Prazo", name: "prazo", widget: "string"}
      - {label: "Imagem", name: "imagem", widget: "image"}